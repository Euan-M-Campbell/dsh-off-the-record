# Secrets vault: the model uses secrets by name, while their values stay out of
# the conversation, the session log, and model requests. Secrets live in the
# harness credential store ($DSH_HOME/.credentials.yaml) under records named
# vault/<name>, for example:
#
#   records:
#     vault/db-url:          # the secret DB_URL
#       kind: api-key
#       key: postgres://…
#
# Every tool result has stored values replaced with [secret:NAME].
- insert:
    - id: otr-vault-local
      name: 'dsh-off-the-record/vault-local'
    - id: otr-tool-vault
      name: 'dsh-off-the-record/tool-vault'
